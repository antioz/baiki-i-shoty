<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Байки и шоты — выбор версии</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    :root {
      --bg: #0a0a0a;
      --elevated: #141414;
      --border: #2a2a2a;
      --text: #f5f1ea;
      --secondary: #8a857d;
      --accent: #d4a574;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 56px;
    }
    h1 {
      font-family: 'PT Serif', serif;
      font-weight: 400;
      font-size: clamp(40px, 6vw, 72px);
      letter-spacing: -0.02em;
      text-align: center;
    }
    .meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 8px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      width: 100%;
      max-width: 880px;
    }
    @media (max-width: 720px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      display: block;
      padding: 40px 32px;
      background: var(--elevated);
      border: 1px solid var(--border);
      border-radius: 8px;
      text-decoration: none;
      color: inherit;
      transition: transform 200ms ease-out, border-color 200ms ease-out;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card .kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }
    .card h2 {
      font-family: 'PT Serif', serif;
      font-weight: 400;
      font-size: 32px;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .card p {
      color: var(--secondary);
      font-size: 15px;
      line-height: 1.5;
    }
    .arrow {
      display: inline-block;
      margin-left: 8px;
      transition: transform 200ms ease-out;
      color: var(--accent);
    }
    .card:hover .arrow { transform: translateX(4px); }
    footer {
      color: var(--secondary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
  </style>
</head>
<body>
  <header>
    <h1>Байки и шоты</h1>
    <div class="meta" style="text-align:center">Превью · выбор версии</div>
  </header>

  <main class="grid">
    <a class="card" href="./v1/">
      <div class="kicker">Версия 1</div>
      <h2>Первый дизайн<span class="arrow">→</span></h2>
      <p>Изначальный кликабельный прототип. Лендинг с картой, страница заведения, плеер, paywall-модалка.</p>
    </a>
    <a class="card" href="./v2/">
      <div class="kicker">Версия 2</div>
      <h2>Второй дизайн<span class="arrow">→</span></h2>
      <p>Альтернативная итерация с переосмысленной типографикой и layout-логикой.</p>
    </a>
  </main>

  <footer>Это прототип. Оплата имитируется.</footer>
</body>
</html>
