<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Байки и шоты</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:wght@400;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #000;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      gap: 64px;
    }
    h1 {
      font-family: 'PT Serif', serif;
      font-weight: 400;
      font-size: clamp(56px, 9vw, 128px);
      letter-spacing: -0.02em;
      text-align: center;
      line-height: 1;
    }
    .sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      margin-top: 20px;
      text-align: center;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #fff;
      color: #fff;
      text-decoration: none;
      font-family: 'PT Serif', serif;
      font-size: 96px;
      letter-spacing: -0.02em;
      transition: background 150ms ease-out, color 150ms ease-out;
    }
    .card:hover {
      background: #fff;
      color: #000;
    }
    @media (max-width: 640px) {
      .card { width: 100%; height: 200px; font-size: 72px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Байки и шоты</h1>
    <div class="sub">Антиосов и Умяров представляют</div>
  </header>

  <main class="grid">
    <a class="card" href="./v1/">V1</a>
    <a class="card" href="./v2/">V2</a>
  </main>
</body>
</html>
